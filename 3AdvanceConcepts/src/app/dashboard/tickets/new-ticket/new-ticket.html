<form (ngSubmit)="onSubmit()" #form>
    <app-control label="title">
        <input name="title" id="title" #title #inpute [(ngModel)]="enteredTitle">
    </app-control>

    <app-control label="request">
        <textarea name="request" id="request" rows="3" #textArea #inpute [(ngModel)]="enteredText"></textarea>
    </app-control>

    <p>
        <button appButton>
          Submit
          <!-- <span class="icon">➡️</span> -->
           <span ngProjectAs = "icon">➡️</span>
        </button>
    </p>
    
</form>

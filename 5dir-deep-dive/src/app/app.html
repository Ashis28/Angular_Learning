<main>
  <app-learning-resources />

  <hr />

  <app-auth />

  @if (isAdmin()) {
    <p>Only admins should see this!</p>
  }
  <!-- <p *ngIf="isAdmin()">Only admins should see this!</p> -->
   <!-- <ng-template appAuthDir="admin">
    <p>Only Admins Should see this</p>
   </ng-template> -->

   <p *appAuthDir="'admin'" class="protected-content admin">
    Only admins should see this!
  </p>
  <p *appAuthDir="'user'" class="protected-content unauthenticated">
    Regular users should see this!
  </p>
  <p *appAuthDir="'guest'" class="protected-content authenticated">
    Guest users should see this!
  </p>
</main>

<app-header></app-header>

<main>
    <ul id="users">
        <!-- @for (user of user; track user.id) { -->
            <li *ngFor="let user of user">
                <app-user [selected]="user.id===selectedUserId" [user]="user" (select)="onSelectUser($event)"></app-user>
            </li>
        <!-- } -->
        
    </ul>

    @if (selectedUser) {
        <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"></app-tasks>
    }@else {
        <p id="fallback">Select a user to see their tasks</p>
    }
</main>
